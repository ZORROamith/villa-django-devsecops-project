
{% load static %}
{% include 'header.html' %}
<center><div class="text">
	<h1>BUILDER'S REQUEST</h1>
</div>
</center>

<div class="container mt-4">
  <div class="row">
  {% for i in builders %}
    <div class="col-lg-4 col-md-6 mb-4">
      <div class="card shadow-sm h-100">
      
        <img src="../media/{{i.photo}}" class="card-img-top" alt="not found" style="height:220px; object-fit:cover;">
        
        <div class="card-body">
          <h5 class="card-title"></h5>
          <p class="card-text">
              <strong>Name:</strong>{{i.name}} <br>
            <strong>Email:</strong>{{i.email}} <br>
            <strong>Phone:</strong>{{i.phone}}<br>
            <strong>Password</strong>{{i.password}}<br>
            
          </p>
        </div>
        
        <div class="card-footer d-flex justify-content-between">
      <a href="{% url 'delete_builder' id=i.id %}">      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
  <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
  <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
</svg></a>
      <a href="{% url 'approve_builder' id=i.id %}">  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-square-fill" viewBox="0 0 16 16">
  <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm10.03 4.97a.75.75 0 0 1 .011 1.05l-3.992 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.75.75 0 0 1 1.08-.022z"/>
</svg></a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>


    {% include 'footer.html' %}
    {% endblock %}
