{% load static %}
{% include 'header.html' %}
<div class="contact section">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 offset-lg-4">
          <div class="section-heading text-center">
            <h6>PROPERTY UPDATE</h6>
            <h2>Get In Touch With Our Agents</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="contact-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-7">
          <div id="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12469.776493332698!2d-80.14036379941481!3d25.907788681148624!2m3!1f357.26927939317244!2f20.870722720054623!3f0!3m2!1i1024!2i768!4f35!3m3!1m2!1s0x88d9add4b4ac788f%3A0xe77469d09480fcdb!2sSunny%20Isles%20Beach!5e1!3m2!1sen!2sth!4v1642869952544!5m2!1sen!2sth" width="100%" height="500px" frameborder="0" style="border:0; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.15);" allowfullscreen=""></iframe>
          </div>
          <div class="row">
            <div class="col-lg-6">
              <div class="item phone">
                <img src="{% static 'assets/images/phone-icon.png' %}" alt="" style="max-width: 52px;">
                <h6>010-020-0340<br><span>Phone Number</span></h6>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="item email">
                <img src="{% static 'assets/images/email-icon.png' %}" alt="" style="max-width: 52px;">
                <h6>info@villa.co<br><span>Business Email</span></h6>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <form id="contact-form" action="propupdates/{{result.id}}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-lg-12">
                <fieldset>
                  <label for="name">UPLOAD PROPERTY PHOTO</label>
                  <input type="file" name="photo" id="photo"  autocomplete="on" required value="{{result.property_photo}}">
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="name">Full Name</label>
                  <input type="text" name="name" id="name" placeholder="Your Name..." autocomplete="on" required value="{{result.property_name}}">
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="category">Category</label>
                  <input type="text" name="category" id="email"  placeholder="Your E-mail..." required="" value="{{result.property_category}}">
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="location">LOcation</label>
                  <input type="text" name="location" id="phone" placeholder="phone" autocomplete="on"  value="{{result.property_location}}">
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="budget">Budget</label>
                   <input type="text" name="budget" id="password"  autocomplete="on"  value="{{result.property_budget}}">
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="bedroom">Bedroom</label>
                   <input type="text" name="bedroom" id="password"  autocomplete="on"  value="{{result.property_bedroom}}">
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="bathroom">Bathroom</label>
                   <input type="text" name="bathroom" id="password" autocomplete="on" value="{{result.property_bathroom}}" >
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="floor">Floor</label>
                   <input type="text" name="floor" id="password" autocomplete="on" value="{{result.property_floor}}">
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="area">Area</label>
                   <input type="text" name="area" id="password"autocomplete="on" value="{{result.property_area}}" >
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <label for="parking">Parking</label>
                   <input type="text" name="parking" id="password" autocomplete="on"  value="{{result.property_parking}}">
                 
                </fieldset>
              </div>
              <div class="col-lg-12">
                <fieldset>
                  <button type="submit" id="form-submit" class="orange-button">UPDATE</button>
                </fieldset>
              </div>
              
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  {% include 'footer.html' %}
