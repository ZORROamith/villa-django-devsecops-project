{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            overflow-x:hidden;
        }

        .sidebar{
            background:#212529;
            min-height:100vh;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px 15px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:#343a40;
        }

        .content{
            padding:25px;
        }

        .card{
            border:none;
            border-radius:12px;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 sidebar">

            <h3 class="text-center text-white py-4">
                Admin Panel
            </h3>

            <a href="userview">USERS
               </a>
              <a href="admin_prop_view">
               PROPERTIES
            </a>
           <a href="admin_book_view">
                BOOKINGS
             </a>

            <a href="reqbuilder">
                BUILDER REQUEST
              
            </a>

            <a href="view_approved_builders">
                APPROVED BUILDERS
               
            </a>

            <a href="logout">
                LOGOUT
               
            </a>

         
           

        </div>

        <!-- Main Content -->

        <div class="col-md-10 content">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
